<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>군무원 기출 학습</title>
  <style>
    :root { --accent: #059669; --accent2: #2563eb; --bg: #fafafa; --text: #1a1a1a; --border: #ddd; }
    body {
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    h1 { font-size: 1.5rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; }
    h2 { font-size: 1.1rem; color: var(--accent); margin-top: 2rem; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1rem 0;
    }
    .card.featured {
      border: 2px solid var(--accent);
      background: #ecfdf5;
    }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #fff !important;
      border-radius: 6px;
      font-weight: 600;
    }
    a.btn:hover { background: #047857; text-decoration: none; }
    p.note { font-size: 0.9rem; color: #555; }
    .muted { color: #64748b; font-size: 0.88rem; }
  </style>
</head>
<body>
  <h1>군무원 기출 — 학습</h1>
  <p class="note">GitHub Pages에서 바로 열 수 있는 HTML입니다.</p>

  <h2>행정학 (메인)</h2>
  <div class="card featured">
    <strong>2025 행정학 9급 — 기출 25문항</strong>
    <p class="muted">문제·보기 → <strong>해설 보기</strong>로 정답·보기별 이유 확인</p>
    <a class="btn" href="./행정학-기출-문제집.html">기출 문제집 열기</a>
  </div>
  <div class="card">
    <ul>
      <li><a href="./행정학-기출-학습노트.html">행정학 학습 노트</a> (누적 정리)</li>
    </ul>
  </div>

  <h2>통신공학 (보관)</h2>
  <div class="card muted">
    <ul>
      <li><a href="./통신공학-기출-학습노트.html" style="color:#2563eb">통신공학 학습노트</a></li>
      <li><a href="./통신공학-기출-계산공식.html" style="color:#2563eb">통신공학 계산 공식</a></li>
    </ul>
  </div>
</body>
</html>
